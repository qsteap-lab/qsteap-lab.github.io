  bio: Shai leads the QSTEAP Lab at the University of Wisconsin–Madison. His research brings together free-electron physics, atomic physics and nanophotonics, with a focus on quantum optics that uses all three at once. He did his graduate work at the Technion – Israel Institute of Technology on topological and quantum near-field optics and free-electron–light interactions, and was then a postdoctoral researcher in the group of Vladan Vuletić at MIT and the MIT–Harvard Center for Ultracold Atoms, working on Rydberg atom arrays and cavity-free atom–photon interfaces.
