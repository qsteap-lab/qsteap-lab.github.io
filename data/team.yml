  bio: 'Shai leads the QSTEAP Lab at the University of Wisconsin–Madison. His research brings together free-electron physics, atomic physics and nanophotonics, with a focus on quantum optics that uses one, two or all three at once. He did his graduate work under Guy Bartal at the Technion – Israel Institute of Technology on topological and quantum near-field optics, frequently collaborating with Ido Kaminer on free-electron–light interactions. for his postdoctoral research, Shai joined the group of Vladan Vuletić at MIT, working on Rydberg atoms and polaritons, neutral atom arrays and neutral atom quantum computers. Shai neglects many hobbies to focus on his research and his family (not necessarily in that order) but never fails to recognize or enjoy a good pop-culture reference.  '
