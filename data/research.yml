- title: Unlocking new capabilities for neutral atom quantum computation and simulation
  tags: Atoms, Photons
  horizon: Ongoing
  image: images/uploads/Screenshot_2026-09-29_121213.png
  summary: Neutral atom arrays have become a frontrunner in the race for [utility scale quantum computation](https://arxiv.org/abs/2607.21554), building on their reconfigurability, scalability and high fidelity for all operations, while allowing some of the most advanced simulations of quantum systems to date. That said, we think there's plenty of room for improvement. Computation still suffers from key bottlenecks constraining [deep quantum circuit implementation](https://journals.aps.org/prxquantum/abstract/10.1103/fd15-4g1n), operational speed and gate fidelities; Simulation is limited to two native models, restricting the range of material properties that can be investigated. With a new, state-of-the-art Rb87 neutral atom array system, we aim to expand the toolbox for quantum computation and simulation with neutral atoms by developing new techniques to address the atoms in high-lying energy states ("Rydberg states"), [both globally and locally](https://journals.aps.org/pra/abstract/10.1103/PhysRevA.108.053318).
- title: Engineering free-electron–light interaction for quantum emission and beyond
  tags: Electrons, Photons
  horizon: Ongoing
  image: images/uploads/2d-interaction-takes-r.jpg
  summary: Contrary to popular belief, free electrons can spontaneously exchange energy with light if the conditions are right. The conditions are usually straightforward, and the interaction is weak, which is why there was a [Nobel Prize](https://www.nobelprize.org/prizes/physics/1958/summary/) for this phenomenon but not much else (fine! it makes for [important detectors](https://en.wikipedia.org/wiki/Cherenkov_detector) too). By designing new structures to mediate the interaction of free electrons and light, we want to shatter the record [we still hold(!)](https://journals.aps.org/prx/abstract/10.1103/PhysRevX.13.011002) for their interaction strength and utilize free electrons as quantum emitters, while exploring how such interaction can improve electron microscopy and spectroscopy, e.g. through electron Doppler cooling. Fabrication and experiments will be performed at joint UW-Madison or National Lab facilities, as well as with our many collaborators in the US and around the world.
- title: Exchanging quantum information between atoms and free electrons using photons
  tags: Electrons, Atoms, Photons
  horizon: Near term
  image: images/concept.png
  summary: Using atomic clouds, controlled by lasers through an effect called [Electromagnetically-Induced Transparency](https://arxiv.org/abs/2601.06345), we can cause electrons to emit quantum light far more coherently and - potentially - in a much brighter fashion than with solid state structures. The same effect can conveniently store the emitted photons from one electron inside the cloud, allowing another electron can absorb it, and the two can become entangled in their energy with the right protocol. Alternatively, once atom-electron interaction is suitably enhanced, an electron beam moving close to two distant single atoms can be used to excite only one of them, creating an entangled atomic state when the electron energy is measured (in a process is called "heralding"). This is our "spécialité de la maison", and we are building (together with companies) a never-before-seen electron microscope system that can accomplish all of these research goals.
