<script>
/* QSTEAP hero: a lattice of "atoms" whose orbits turn toward the cursor.
   Near the cursor the orbits glow white -> UW red, electrons glow blue. */
(function () {
  const host = document.getElementById('hero-animation');
  if (!host) return;
  const canvas = document.createElement('canvas');
  host.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, dpr = 1, nodes = [];
  const spacing = 72;
  let mouse = null;          // real pointer position (canvas coords)
  let focus = { x: 0, y: 0 }; // smoothed focus point

  function setPointer(cx, cy) {
    const r = canvas.getBoundingClientRect();
    mouse = { x: cx - r.left, y: cy - r.top };
  }
  window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => setPointer(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  host.parentElement.addEventListener('mouseleave', () => { mouse = null; });

  function build() {
    nodes = [];
    const ox = (W % spacing) / 2, oy = (H % spacing) / 2;
    for (let x = ox; x < W + spacing; x += spacing)
      for (let y = oy; y < H + spacing; y += spacing)
        nodes.push({ x, y, ph: Math.random() * Math.PI * 2, sp: 0.8 + Math.random() * 0.6 });
  }
  function resize() {
    W = host.clientWidth || window.innerWidth;
    H = host.clientHeight || 380;
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    focus = { x: W / 2, y: H / 2 };
    build();
  }
  window.addEventListener('resize', resize);

  const lerp = (a, b, t) => a + (b - a) * t;
  const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
  const FAR = [64, 68, 76], NEAR = [240, 240, 240], RED = [214, 32, 38], BLUE = [40, 140, 245];

  function frame(t) {
    const time = t / 1000;
    // idle drift when no pointer is over the page
    const target = mouse || { x: W * (0.5 + 0.32 * Math.sin(time * 0.23)), y: H * (0.5 + 0.3 * Math.sin(time * 0.31 + 1)) };
    focus.x = lerp(focus.x, target.x, 0.08); focus.y = lerp(focus.y, target.y, 0.08);

    ctx.fillStyle = '#0b0c0f'; ctx.fillRect(0, 0, W, H);
    const g = ctx.createRadialGradient(focus.x, focus.y, 20, focus.x, focus.y, Math.max(W, H) * 0.7);
    g.addColorStop(0, 'rgba(197,5,12,0.10)'); g.addColorStop(0.4, 'rgba(40,140,245,0.04)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const maxD = Math.max(520, W * 0.45);
    for (const n of nodes) {
      const dx = focus.x - n.x, dy = focus.y - n.y;
      const d = Math.hypot(dx, dy);
      const k = Math.max(0, 1 - d / maxD);           // 0 far .. 1 near
      let c = mix(FAR, NEAR, k * k);
      if (k > 0.8) c = mix(c, RED, (k - 0.8) / 0.2);
      const ang = Math.atan2(dy, dx);
      const rx = 17, ry = 5 + 3 * (1 - k);            // orbit flattens toward the cursor
      ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(ang);
      ctx.globalAlpha = 0.25 + 0.75 * k * k;
      ctx.strokeStyle = rgb(c); ctx.lineWidth = 1.1;
      ctx.shadowColor = rgb(c); ctx.shadowBlur = 2 + 10 * k;
      ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
      // nucleus
      ctx.fillStyle = rgb(c); ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
      // orbiting electron
      const p = reduce ? n.ph : n.ph + time * n.sp * (1 + 2 * k);
      const ec = mix(c, BLUE, Math.min(1, k * 1.4));
      ctx.fillStyle = rgb(ec); ctx.shadowColor = rgb(ec); ctx.shadowBlur = 4 + 12 * k;
      ctx.beginPath(); ctx.arc(rx * Math.cos(p), ry * Math.sin(p), 1.8 + 1.2 * k, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
